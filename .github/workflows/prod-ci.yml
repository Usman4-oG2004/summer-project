name: Production CI Pipeline

on:
  pull_request:
    branches: [ production ]

jobs:
  production-readiness-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Full HTML Validation
        run: npx htmlhint "src/**/*.html"

      - name: Full CSS Validation
        run: npx stylelint "styles/**/*.css"

      - name: Final Build Verification
        run: npm run build
