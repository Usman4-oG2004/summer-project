<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - CloudNova</title>
  <link rel="stylesheet" href="../styles/index.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">CloudNova</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="contact-section">
      <h1>Contact Us</h1>
      <p>Have a question? We would love to hear from you.</p>
      <form class="contact-form" action="#" method="post">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Your Name">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="your@email.com">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Your message..."></textarea>
        <button type="submit">Send Message</button>
      </form>
      <div class="contact-info">
        <p>Email: info@cloudnova.io</p>
        <p>Phone: +92-300-1234567</p>
        <p>Address: 123 Tech Street, Lahore, Pakistan</p>
      </div>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 CloudNova. All rights reserved.</p>
  </footer>
</body>
</html>
